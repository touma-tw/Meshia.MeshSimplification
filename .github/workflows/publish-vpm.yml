name: Publish VPM Release

# Builds the package zip, publishes a GitHub Release, and updates the VPM listing
# (index.json on the gh-pages branch) with the release URL and its SHA256.
#
# Run manually from the Actions tab (Run workflow), or automatically by pushing a
# version tag such as `4.0.1`. The version itself always comes from package.json.

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-vpm
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.ramtype0.meshia.mesh-simplification
  LISTING_PAGE_URL: https://touma-tw.github.io/Meshia.MeshSimplification/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and file names
        id: meta
        run: |
          version="$(jq -r '.version' package.json)"
          zip="${PACKAGE_NAME}-${version}.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "download_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/${zip}" >> "$GITHUB_OUTPUT"

      - name: Build package zip
        run: git archive --format=zip -o "${{ steps.meta.outputs.zip }}" HEAD

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(sha256sum "${{ steps.meta.outputs.zip }}" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.zip }}
          fail_on_unmatched_files: true

      - name: Update VPM listing on gh-pages
        run: |
          set -euo pipefail

          # The per-version manifest published in the listing = package.json + url + zipSHA256.
          manifest="$(jq -c \
            --arg url "${{ steps.meta.outputs.download_url }}" \
            --arg sha "${{ steps.sha.outputs.sha256 }}" \
            '. + {url: $url, zipSHA256: $sha}' package.json)"

          git fetch origin gh-pages
          git worktree add gh-pages-wt origin/gh-pages

          tmp="$(mktemp)"
          jq \
            --arg name "$PACKAGE_NAME" \
            --arg version "${{ steps.meta.outputs.version }}" \
            --argjson manifest "$manifest" \
            '.packages[$name].versions[$version] = $manifest' \
            gh-pages-wt/index.json > "$tmp"
          mv "$tmp" gh-pages-wt/index.json

          cd gh-pages-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --staged --quiet; then
            echo "Listing already up to date."
          else
            git commit -m "ci: publish ${PACKAGE_NAME} ${{ steps.meta.outputs.version }}"
            git push origin HEAD:gh-pages
          fi

      - name: Summary
        run: |
          {
            echo "### VPM release published"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Version (from package.json) | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Package zip | \`${{ steps.meta.outputs.zip }}\` |"
            echo "| SHA256 | \`${{ steps.sha.outputs.sha256 }}\` |"
            echo "| Release asset | ${{ steps.meta.outputs.download_url }} |"
            echo "| Listing | ${LISTING_PAGE_URL} |"
            echo ""
            echo "> Reminder: GitHub Pages must be enabled once (Settings → Pages → Deploy from branch → \`gh-pages\` / root) for the listing URL to serve."
          } >> "$GITHUB_STEP_SUMMARY"
