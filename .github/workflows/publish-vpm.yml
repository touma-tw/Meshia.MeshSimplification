name: Publish Release

# Builds the package zip and publishes it as a GitHub Release.
# The VPM listing repository (touma-tw/vpm) aggregates this package from its Releases,
# so no listing is maintained here.
#
# Run manually from the Actions tab (Run workflow), or by pushing a version tag such as
# `4.0.1`. The version always comes from package.json.

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

env:
  PACKAGE_NAME: com.ramtype0.meshia.mesh-simplification

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and file name
        id: meta
        run: |
          version="$(jq -r '.version' package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=${PACKAGE_NAME}-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build package zip
        run: git archive --format=zip -o "${{ steps.meta.outputs.zip }}" HEAD

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.zip }}
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "### Release published: \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "- Asset: \`${{ steps.meta.outputs.zip }}\`"
            echo "- The VPM listing (\`touma-tw/vpm\`) picks this up from Releases."
          } >> "$GITHUB_STEP_SUMMARY"
